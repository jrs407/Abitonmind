services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: abitonmind
      POSTGRES_USER: abitonmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql

volumes:
  datos-postgres:
